project:
  title: "PM32 Multiplier"
  author: "Tanya Sharma"
  description: "4-bit by 4-bit multiplier"
  language: "Verilog"
  clock_hz: 0
  top_module: "tt_um_tanya_pm32"

  source_files:
    - "project.v"
    - "PM32.v"

  pinout:
    ui[0]: "A bit 0"
    ui[1]: "A bit 1"
    ui[2]: "A bit 2"
    ui[3]: "A bit 3"

    ui[4]: "B bit 0"
    ui[5]: "B bit 1"
    ui[6]: "B bit 2"
    ui[7]: "B bit 3"

    uo[0]: "Product bit 0"
    uo[1]: "Product bit 1"
    uo[2]: "Product bit 2"
    uo[3]: "Product bit 3"
    uo[4]: "Product bit 4"
    uo[5]: "Product bit 5"
    uo[6]: "Product bit 6"
    uo[7]: "Product bit 7"

    uio[0]: "Unused"
    uio[1]: "Unused"
    uio[2]: "Unused"
    uio[3]: "Unused"
    uio[4]: "Unused"
    uio[5]: "Unused"
    uio[6]: "Unused"
    uio[7]: "Unused"
